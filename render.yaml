# Blueprint do Render (render.com/docs/blueprint-spec).
#
# "plan: starter" é o que mantém o serviço ligado 24h sem dormir — no
# plano "free" o Render derruba o serviço após ~15 min sem tráfego e ele
# demora alguns segundos para acordar na próxima requisição. Troque para
# "free" aqui se quiser só testar antes de pagar.
#
# As variáveis marcadas com "sync: false" são segredos: o Render vai
# pedir o valor manualmente no painel na hora de criar o serviço — elas
# nunca ficam neste arquivo nem no repositório.
services:
  - type: web
    name: erp-fiado
    runtime: node
    plan: starter
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: PORT
        value: 3000
      - key: JWT_SECRET
        sync: false
      - key: ADMIN_USER
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: PGHOST
        sync: false
      - key: PGPORT
        sync: false
      - key: PGUSER
        sync: false
      - key: PGPASSWORD
        sync: false
      - key: PGDATABASE
        sync: false
