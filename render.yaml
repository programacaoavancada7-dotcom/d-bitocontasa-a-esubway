# Blueprint do Render (render.com/docs/blueprint-spec).
#
# "plan: free" + um bot de uptime pingando a URL a cada poucos minutos
# evita o soninho de ~15 min sem tráfego do plano gratuito. Isso não é
# um "sempre ligado" garantido pela Render (ver README) — se quiser essa
# garantia oficial, troque para "plan: starter" (pago).
#
# As variáveis marcadas com "sync: false" são segredos: o Render vai
# pedir o valor manualmente no painel na hora de criar o serviço — elas
# nunca ficam neste arquivo nem no repositório.
services:
  - type: web
    name: erp-fiado
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: PORT
        value: 3000
      - key: JWT_SECRET
        sync: false
      - key: ADMIN_USER
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: PGHOST
        sync: false
      - key: PGPORT
        sync: false
      - key: PGUSER
        sync: false
      - key: PGPASSWORD
        sync: false
      - key: PGDATABASE
        sync: false
      - key: WHATSAPP_HABILITADO
        value: 'true'
      - key: WHATSAPP_GRUPO_NOME
        value: Açaí clts
      - key: PIX_CHAVE
        value: 37.937.310/0001-47
